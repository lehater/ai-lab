# Disposable local test instance: NOT a production AI Lab service.
# Image version is intentionally explicit; collect image ID/digest on lab-test.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.5
    restart: "no"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678/
      WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run ./lab.sh up first}
      N8N_SECURE_COOKIE: "false" # local HTTP ONLY
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      TZ: UTC
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
